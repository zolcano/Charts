categories:
  - Pyrescom

questions:
  - variable: namespace
    label: "Namespace"
    description: "Namespace Kubernetes pour le déploiement."
    type: string
    default: "pyrescom"
    required: true
    group: "Déploiement"

  # REGISTRY ---------------------------------------------------------
  - variable: registry.server
    label: "Registry Docker"
    description: "URL de l'Azure Container Registry."
    type: string
    default: "staffngoacr.azurecr.io"
    required: true
    group: "Déploiement"

  - variable: acrSecret.username
    label: "ACR - Username"
    type: string
    default: "staffngoacr"
    required: true
    group: "Déploiement"

  - variable: acrSecret.password
    label: "ACR - Password"
    type: password
    required: true
    group: "Déploiement"

  # ────────────────────────────────────────────
  # TRAEFIK
  # ────────────────────────────────────────────
  - variable: traefik.tlsroute.url
    label: "url"
    type: hostname
    default: "pyres.staffngo.com"
    required: true
    group: "Traefik"

  - variable: traefik.gateway.name
    label: "Gateway Name"
    description: "Name of the Traefik Gateway object"
    type: string
    default: "traefik-gateway"
    required: true
    group: "Traefik"

  - variable: traefik.gateway.namespace
    label: "Gateway Namespace"
    description: "Namespace where the Traefik Gateway is deployed"
    type: string
    default: "traefik"
    required: true
    group: "Traefik"

  - variable: traefik.hostname
    label: "Hostname"
    description: "Public hostname to expose the service"
    type: string
    default: "pyrescom.staffngo.com"
    required: true
    group: "Traefik"

  # ---------------- PYRESCOM ----------------
  - variable: services.pyrescom.image
    label: "image"
    type: string
    default: "pyrescom"
    group: "Pyrescom"

  - variable: services.pyrescom.tag
    label: "Tag"
    type: string
    default: "latest"
    group: "Pyrescom"

  - variable: services.pyrescom.replicaCount
    label: "Réplicas"
    type: int
    default: 1
    group: "Pyrescom"

  - variable: services.pyrescom.pullPolicy
    label: "Pull Policy"
    type: enum
    default: "IfNotPresent"
    options:
      - value: "IfNotPresent"
        label: "IfNotPresent"
      - value: "Always"
        label: "Always"
      - value: "Never"
        label: "Never"
    group: "Pyrescom"

  - variable: services.pyrescom.ressources.storageClassName
    label: "storage class name"
    type: string
    default: "azurefile-csi"
    group: "Pyrescom"

  - variable: configmap.ternet.SslPort
    label: "SSL Port"
    description: "Port used for SSL/TLS connections"
    type: int
    default: 5443
    group: "Pyrescom"

  # ────────────────────────────────────────────
  # TERNET
  # ────────────────────────────────────────────
  - variable: configmap.ternet.ServiceName
    label: "ServiceName"
    description: "Internal name of the Ternet service"
    type: string
    default: "Ternet"
    group: "Ternet"

  - variable: configmap.ternet.ServiceDisplayName
    label: "ServiceDisplayName"
    description: "Display name shown"
    type: string
    default: "Ternet"
    group: "Ternet"

  - variable: configmap.ternet.BmpStop
    label: "BmpStop"
    description: "Bitmap image path for stop button | optionnal"
    type: string
    default: ""
    group: "Ternet"

  - variable: configmap.ternet.IcoApp
    label: "IcoApp"
    description: "Path to the application icon | optionnal"
    type: string
    default: ""
    group: "Ternet"

  - variable: configmap.ternet.ServicePort
    label: "ServicePort"
    description: "Port of the TnView app"
    type: int
    default: 6000
    group: "Ternet"

  - variable: configmap.ternet.CfgSrvPort
    label: "CfgSrvPort"
    description: "Port for the configuration app"
    type: int
    default: 6001
    group: "Ternet"

  - variable: configmap.ternet.SrvTcpMode
    label: "SrvTcpMode"
    description: "Enable TCP server mode (1=enabled, 0=disabled)"
    type: int
    default: 1
    group: "Ternet"

  - variable: configmap.ternet.MultiClient
    label: "MultiClient"
    description: "Allow multiple simultaneous clients (1=yes, 0=no)"
    type: int
    default: 1
    group: "Ternet"

  - variable: configmap.ternet.CipherList
    label: "CipherList"
    description: "List of allowed SSL ciphers (empty = default)"
    type: string
    default: ""
    group: "Ternet"

  - variable: configmap.ternet.CipherServerPreference
    label: "CipherServerPreference"
    description: "Use server cipher preference order (1=yes, 0=no)"
    type: int
    default: 0
    group: "Ternet"

  - variable: configmap.ternet.AutoCreateIdClient
    label: "AutoCreateIdClient"
    description: "Automatically create client ID on connect | default empty"
    type: string
    default: ""
    group: "Ternet"

  - variable: configmap.ternet.AutoCreateSslTemplate
    label: "Auto Create SSL Template"
    description: "SSL template to use for auto-creation | default empty"
    type: string
    default: ""
    group: "Ternet"

  - variable: configmap.ternet.MaxDataLen
    label: "MaxDataLen"
    description: "Maximum data length in bytes"
    type: int
    default: 1450
    group: "Ternet"

  - variable: configmap.ternet.BinMaxDataLen
    label: "BinMaxDataLen"
    description: "Maximum binary data length in bytes"
    type: int
    default: 32768
    group: "Ternet"

  - variable: configmap.ternet.MaxTraceLines
    label: "MaxTraceLines"
    description: "Maximum number of lines in trace/log file"
    type: int
    default: 10000
    group: "Ternet"

  - variable: configmap.ternet.ThreadPriorityLower
    label: "ThreadPriorityLower"
    description: "Lower thread priority (1=yes, 0=no)"
    type: int
    default: 1
    group: "Ternet"

  - variable: configmap.ternet.TdialogRecNum
    label: "TdialogRecNum"
    description: "Number of dialog records to keep"
    type: int
    default: 10
    group: "Ternet"

  - variable: configmap.ternet.TdialogX0Priority
    label: "TdialogX0Priority"
    description: "Priority for X0 dialog threads"
    type: int
    default: 0
    group: "Ternet"

  - variable: configmap.ternet.TimerTreatment
    label: "TimerTreatment"
    description: "Timer handling strategy"
    type: string
    default: ""
    group: "Ternet"

  - variable: configmap.ternet.OneFileForEachTermod
    label: "OneFileForEachTermod"
    description: "Create one file per termod (1=yes, 0=no)"
    type: int
    default: 0
    group: "Ternet"

  - variable: configmap.ternet.NoFileLock
    label: "NoFileLock"
    description: "Disable file locking (1=disabled, 0=enabled)"
    type: int
    default: 0
    group: "Ternet"

  - variable: configmap.ternet.FileTransferOnAutoFilePurge
    label: "FileTransferOnAutoFilePurge"
    description: "Trigger file transfer on automatic file purge"
    type: int
    default: 0
    group: "Ternet"

  - variable: configmap.ternet.FileTransferIfEmptyOnConnect
    label: "FileTransferIfEmptyOnConnect"
    description: "Trigger file transfer if empty on connect"
    type: int
    default: 0
    group: "Ternet"

  - variable: configmap.ternet.StatFile
    label: "StatFile"
    description: "Path to the statistics output file | default empty"
    type: string
    default: ""
    group: "Ternet"

  - variable: configmap.ternet.StatInterval
    label: "StatInterval"
    description: "Interval in seconds between stats writes"
    type: int
    default: 60
    group: "Ternet"

  - variable: configmap.ternet.SendAtzToModem
    label: "SendAtzToModem"
    description: "Send ATZ reset command to modem on init (1=yes, 0=no)"
    type: int
    default: 1
    group: "Ternet"

  - variable: configmap.ternet.ModemConnectTimeout
    label: "ModemConnectTimeout"
    description: "Timeout in seconds for modem connection"
    type: int
    default: 60
    group: "Ternet"

  - variable: configmap.ternet.UserX
    label: "UserX"
    description: "no info"
    type: int
    default: 1
    group: "Ternet"

  - variable: configmap.ternet.UserXComputer
    label: "UserX Computer"
    description: "no info"
    type: string
    default: "*"
    group: "Ternet"

  # ────────────────────────────────────────────
  # LIBHTTP2
  # ────────────────────────────────────────────

  - variable: configmap.libhttp2.HttpServerName
    label: "HttpServerName"
    description: "Hostname of the target HTTP server | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpServerPort
    label: "HttpServerPort"
    description: "Port of the target HTTP server"
    type: int
    default: 80
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpServerHttps
    label: "HttpServerHttps"
    description: "Use HTTPS for HTTP server connection (1=yes, 0=no)"
    type: int
    default: 0
    group: "LibHTTP2"

  - variable: configmap.libhttp2.NumberOfConnection
    label: "NumberOfConnection"
    description: "Maximum number of simultaneous HTTP connections"
    type: int
    default: 5
    group: "LibHTTP2"

  - variable: configmap.libhttp2.KeepAlive
    label: "KeepAlive"
    description: "Enable HTTP keep-alive (1=yes, 0=no)"
    type: int
    default: 0
    group: "LibHTTP2"

  - variable: configmap.libhttp2.SslMethod
    label: "SslMethod"
    description: "SSL/TLS version (0=SSLv3, 1=TLSv1, 2=TLSv1.1, 3=TLSv1.2)"
    type: enum
    default: 3
    options:
      - 0
      - 1
      - 2
      - 3
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OsCaStore
    label: "OsCaStore"
    description: "Use OS certificate authority store (1=yes, 0=no)"
    type: int
    default: 0
    group: "LibHTTP2"

  - variable: configmap.libhttp2.NoSslVerify
    label: "NoSslVerify"
    description: "Disable SSL certificate verification (1=disabled, 0=enabled)"
    type: int
    default: 0
    group: "LibHTTP2"

  - variable: configmap.libhttp2.UserName
    label: "UserName"
    description: "HTTP basic auth username | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.Password
    label: "Password"
    description: "HTTP basic auth password | default empty"
    type: password
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.ProxyServerName
    label: "ProxyServerName"
    description: "Hostname of the HTTP proxy server | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.ProxyServerPort
    label: "ProxyServerPort"
    description: "Port of the HTTP proxy server | default 8080"
    type: int
    default: 8080
    group: "LibHTTP2"

  - variable: configmap.libhttp2.ProxyUserName
    label: "ProxyUserName"
    description: "Username for proxy authentication | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.ProxyPassword
    label: "ProxyPassword"
    description: "Password for proxy authentication | default empty"
    type: password
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.LogFileMaxSize
    label: "LogFileMaxSize"
    description: "Maximum log file size in bytes"
    type: int
    default: 100000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.LogAll
    label: "LogAll"
    description: "Enable full request/response logging (1=yes, 0=no)"
    type: int
    default: 0
    group: "LibHTTP2"

  - variable: configmap.libhttp2.StatusFile
    label: "StatusFile"
    description: "Enable status file output (1=yes, 0=no)"
    type: int
    default: 0
    group: "LibHTTP2"

  - variable: configmap.libhttp2.TmpDir
    label: "TmpDir"
    description: "Path to the temporary files directory"
    type: string
    default: "/tmp"
    group: "LibHTTP2"

  - variable: configmap.libhttp2.PercentEncoding
    label: "PercentEncoding"
    description: "Enable URL percent encoding (1=yes, 0=no)"
    type: int
    default: 0
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpBnPath
    label: "HttpBnPath"
    description: "URL path for HttpBn endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpBnRxTimeout
    label: "HttpBnRxTimeout"
    description: "Receive timeout in ms for HttpBn"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpX0Path
    label: "HttpX0Path"
    description: "URL path for HttpX0 endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpX0RxTimeout
    label: "HttpX0RxTimeout"
    description: "Receive timeout in ms for HttpX0"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpXEPath
    label: "HttpXEPath"
    description: "URL path for HttpXE endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpXERxTimeout
    label: "HttpXERxTimeout"
    description: "Receive timeout in ms for HttpXE"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpDriverOnPath
    label: "HttpDriverOnPath"
    description: "URL path for driver activation endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpDriverOnRxTimeout
    label: "HttpDriverOnRxTimeout"
    description: "Receive timeout in ms for driver activation"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpDriverOffPath
    label: "HttpDriverOffPath"
    description: "URL path for driver deactivation endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpDriverOffRxTimeout
    label: "HttpDriverOffRxTimeout"
    description: "Receive timeout in ms for driver deactivation"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpTimeoutPath
    label: "HttpTimeoutPath"
    description: "URL path for timeout endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpTimeoutRxTimeout
    label: "HttpTimeoutRxTimeout"
    description: "Receive timeout in ms for timeout endpoint"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpDialogPath
    label: "HttpDialogPath"
    description: "URL path for dialog endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.HttpDialogRxTimeout
    label: "HttpDialogRxTimeout"
    description: "Receive timeout in ms for dialog endpoint"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_ServerName
    label: "OAuth_2_0_ServerName"
    description: "Hostname of the OAuth 2.0 authorization server | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_ServerPort
    label: "OAuth_2_0_ServerPort"
    description: "Port of the OAuth 2.0 server | default 443"
    type: int
    default: 443
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_TokenPath
    label: "OAuth_2_0_TokenPath"
    description: "URL path to the OAuth 2.0 token endpoint | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_TokenTimeout
    label: "OAuth_2_0_TokenTimeout"
    description: "Timeout in ms for token requests"
    type: int
    default: 10000
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_Username
    label: "OAuth_2_0_Username"
    description: "Username for OAuth 2.0 authentication | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_Password
    label: "OAuth_2_0_Password"
    description: "Password for OAuth 2.0 authentication | default empty"
    type: password
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_Id
    label: "OAuth_2_0_Id"
    description: "Client ID for OAuth 2.0 | default empty"
    type: string
    default: ""
    group: "LibHTTP2"

  - variable: configmap.libhttp2.OAuth_2_0_Secret
    label: "OAuth_2_0_Secret"
    description: "Client secret for OAuth 2.0 | default empty"
    type: password
    default: ""
    group: "LibHTTP2"
