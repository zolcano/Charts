categories:
  - mcp gitlab

questions:
  # ─────────────────────────────────────────────
  # NAMESPACE
  # ─────────────────────────────────────────────
  - variable: namespace
    label: "Namespace Kubernetes"
    description: "Namespace dans lequel déployer le chart."
    type: string
    default: "mcp-gitlab"
    required: true
    group: "Général"

  # ─────────────────────────────────────────────
  # ACR / REGISTRY
  # ─────────────────────────────────────────────
  - variable: registry.server
    label: "Serveur de registre (ACR)"
    type: string
    default: "staffngoacr.azurecr.io"
    required: true
    group: "Registre (ACR)"

  - variable: acrSecret.username
    label: "Nom d'utilisateur ACR"
    type: string
    default: "staffngoacr"
    required: true
    group: "Registre (ACR)"

  - variable: acrSecret.password
    label: "Mot de passe ACR"
    type: password
    required: true
    group: "Registre (ACR)"

  # ─────────────────────────────────────────────
  # SERVICE / IMAGE
  # ─────────────────────────────────────────────
  - variable: services.mcp.image
    label: "image"
    type: string
    default: "mcp.gitlab"
    required: true
    group: "Application"

  - variable: services.mcp.tag
    label: "tag"
    type: string
    default: "18062025.1"
    required: true
    group: "Application"

  - variable: services.mcp.replicaCount
    label: "Nombre de replicas"
    type: int
    default: 1
    min: 1
    max: 5
    required: true
    group: "Application"

  - variable: services.mcp.pullPolicy
    label: "Pull Policy"
    type: enum
    default: "IfNotPresent"
    options:
      - value: "IfNotPresent"
        label: "IfNotPresent"
      - value: "Always"
        label: "Always"
      - value: "Never"
        label: "Never"
    group: "Application"

  # ─────────────────────────────────────────────
  # TRAEFIK / INGRESS
  # ─────────────────────────────────────────────
  - variable: traefik.httproute.url
    label: "url"
    type: hostname
    default: "mcp.staffngo.com"
    required: true
    group: "Traefik"

  - variable: traefik.subPath
    description: "hostname/subpath"
    label: "Subpath"
    type: string
    default: "gitlab"
    required: true
    group: "Traefik"

  - variable: traefik.gateway.name
    label: "Nom de la Gateway Traefik"
    type: string
    default: "traefik-gateway"
    required: true
    group: "Traefik"

  - variable: traefik.gateway.namespace
    label: "Namespace de la Gateway Traefik"
    type: string
    default: "traefik"
    required: true
    group: "Traefik"

  - variable: traefik.gateway.sectionName
    label: "Section de la Gateway (entrypoint)"
    description: "Nom de la section listener dans la Gateway (ex: websecure, web)."
    type: string
    default: "websecure"
    required: true
    group: "Traefik"

  # ─────────────────────────────────────────────
  # SECRET
  # ─────────────────────────────────────────────
  - variable: secret.mcp-gitlab-sec.REMOTE_GITLAB_MCP_GITLAB_TOKEN
    label: "gitlab token"
    type: password
    required: true
    group: "Secret"

  - variable: secret.mcp-gitlab-sec.REMOTE_GITLAB_MCP_PUBLIC_KEY
    label: "gitlab public key"
    type: password
    required: true
    group: "Secret"
