---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gitlab
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    chart: {{ .Chart.Name }}-{{ .Chart.version }}
spec:
  type: {{ .Values.services.mcp.service.type }}
  selector:
    app: mcp-gitlab
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: {{ .Values.services.mcp.ports[0].name }}
