---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gitlab
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
      sectionName: {{ .Values.traefik.gateway.sectionName }}
  hostnames:
    - {{ .Values.traefik.hostname }}
  rules:
    - backendRefs:
        - name: {{ .Values.traefik.subPath }}
          namespace: {{ .Values.namespace }}
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /{{ .Values.services.mcp.pathPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
