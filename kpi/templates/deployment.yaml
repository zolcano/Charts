{{- with .Values.services.kpi }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpi
  namespace: {{ $.Values.namespace }}
  labels:
    app: kpi
    app.kubernetes.io/managed-by: Helm
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app: kpi
  template:
    metadata:
      labels:
        app: kpi
    spec:
      imagePullSecrets:
        - name: {{ $.Values.registry.secretName }}
      containers:
        - name: kpi
          image: "{{ $.Values.registry.server }}/{{ .image }}:{{ .tag }}"
          imagePullPolicy: {{ .pullPolicy }}
          ports:
            {{- range .ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $secretName, $secretData := $.Values.secret }}
            {{- range $key, $val := $secretData }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: kpi-data
              mountPath: /data
      volumes:
        - name: kpi-data
          persistentVolumeClaim:
            claimName: kpi-data-pvc

{{- end }}
