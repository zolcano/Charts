{{- if .Values.redis.cluster.enabled }}
{{- $clusterReplicas := int (sub (div .Values.redis.cluster.nodes 3) 1) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-heal
  namespace: {{ .Values.namespace }}
  labels:
    app: redis
    app.kubernetes.io/managed-by: Helm
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  schedule: {{ .Values.redis.heal.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: {{ .Values.redis.heal.restartPolicy }}
          containers:
            - name: redis-heal
              image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
              env:
                - name: NAMESPACE
                  value: {{ .Values.namespace }}
                - name: REPLICA_COUNT
                  value: {{ .Values.redis.cluster.nodes | quote }}
                - name: CLUSTER_REPLICAS
                  value: {{ $clusterReplicas | quote }}
                {{- if .Values.redis.auth.enabled }}
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.redis.auth.existingSecret | default "redis-sec" }}
                      key: {{ .Values.redis.auth.secretKey | default "password" }}
                {{- end }}
              resources:
                {{- if .Values.redis.resources.requests.enabled }}
                requests:
                  cpu: {{ .Values.redis.resources.requests.cpu }}
                  memory: {{ .Values.redis.resources.requests.memory }}
                {{- end }}
                {{- if .Values.redis.resources.limits.enabled }}
                limits:
                  cpu: {{ .Values.redis.resources.limits.cpu }}
                  memory: {{ .Values.redis.resources.limits.memory }}
                {{- end }}
              command:
                - sh
                - -c
                - |
                  set -e
                  echo "=== Redis Cluster Heal ==="

                  {{- if .Values.redis.auth.enabled }}
                  AUTH="-a $REDIS_PASSWORD"
                  {{- else }}
                  AUTH=""
                  {{- end }}

                  PODS=""
                  i=0
                  while [ $i -lt $REPLICA_COUNT ]; do
                    PODS="$PODS redis-${i}.redis.${NAMESPACE}.svc.cluster.local"
                    i=$((i + 1))
                  done

                  # 1. Attendre que tous les noeuds soient joignables
                  echo "Waiting for all nodes..."
                  for HOST in $PODS; do
                    RETRIES=0
                    until redis-cli $AUTH -h "$HOST" ping 2>/dev/null | grep -q PONG; do
                      RETRIES=$((RETRIES + 1))
                      if [ $RETRIES -ge 30 ]; then
                        echo "ERROR: $HOST unreachable after 30 attempts, aborting."
                        exit 1
                      fi
                      echo "  $HOST not ready ($RETRIES/30), retrying in 5s..."
                      sleep 5
                    done
                    echo "  $HOST OK"
                  done
                  echo "All nodes reachable."

                  # 2. Vérifier l'état du cluster sur chaque noeud
                  echo "Checking cluster state on all nodes..."

                  CLUSTER_OK=true

                  for HOST in $PODS; do
                    STATE=$(redis-cli $AUTH -h "$HOST" cluster info 2>/dev/null \
                      | grep cluster_state | cut -d: -f2 | tr -d '\r\n ')

                    echo "  $HOST => cluster_state=$STATE"

                    if [ "$STATE" != "ok" ]; then
                      CLUSTER_OK=false
                    fi
                  done

                  if [ "$CLUSTER_OK" = "true" ]; then
                    # 3a. Heal doux : retirer les noeuds morts
                    echo "Cluster healthy on all nodes — removing failed nodes..."

                    for HOST in $PODS; do
                      redis-cli $AUTH -h "$HOST" cluster nodes 2>/dev/null \
                        | grep -i fail \
                        | awk '{print $1}' \
                        | while read NODE_ID; do
                            echo "  [$HOST] Forgetting failed node: $NODE_ID"

                            for TARGET in $PODS; do
                              redis-cli $AUTH -h "$TARGET" cluster forget "$NODE_ID" 2>/dev/null || true
                            done
                          done
                    done

                    echo "=== Heal complete (soft) ==="
                    exit 0
                  fi

                  # 3. Heal hard : FLUSHALL + RESET
                  echo "Cluster FAIL detected — resetting all nodes..."
                  for HOST in $PODS; do
                    echo "  FLUSHALL + CLUSTER RESET HARD on $HOST..."
                    redis-cli $AUTH -h "$HOST" FLUSHALL 2>/dev/null || true
                    redis-cli $AUTH -h "$HOST" CLUSTER RESET HARD 2>/dev/null || true
                  done
                  sleep 3

                  # 4. Valider le nombre de noeuds minimum
                  MIN_NODES=$(( (CLUSTER_REPLICAS + 1) * 3 ))
                  if [ $REPLICA_COUNT -lt $MIN_NODES ]; then
                    echo "ERROR: $REPLICA_COUNT nodes insuffisant pour --cluster-replicas $CLUSTER_REPLICAS (minimum $MIN_NODES requis)"
                    exit 1
                  fi

                  # 5. Recréer le cluster
                  NODES=""
                  for HOST in $PODS; do
                    NODES="$NODES $HOST:6379"
                  done
                  echo "Recreating cluster: $NODES"
                  redis-cli $AUTH --cluster create $NODES \
                    --cluster-replicas $CLUSTER_REPLICAS --cluster-yes

                  echo "=== Heal complete (hard reset) ==="
{{- end }}
