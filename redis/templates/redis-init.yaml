{{- if .Values.redis.cluster.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-init
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "3"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: {{ .Values.redis.heal.restartPolicy }}
      containers:
        - name: redis-init
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          env:
            - name: NAMESPACE
              value: {{ .Values.namespace }}
            - name: REPLICA_COUNT
              value: {{ .Values.redis.cluster.nodes | quote }}
            - name: CLUSTER_REPLICAS
              value: {{ .Values.redis.cluster.clusterReplicas | default 1 | quote }}
            {{- if .Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret | default "redis-sec" }}
                  key: {{ .Values.redis.auth.secretKey | default "password" }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              # Auth helper
              {{- if .Values.redis.auth.enabled }}
              AUTH="-a $REDIS_PASSWORD"
              {{- else }}
              AUTH=""
              {{- end }}

              # Attendre que tous les noeuds répondent
              i=0
              while [ $i -lt $REPLICA_COUNT ]; do
                until redis-cli $AUTH -h redis-${i}.redis.${NAMESPACE}.svc.cluster.local ping | grep -q PONG; do
                  echo "Waiting for redis-${i}..."; sleep 3;
                done
                echo "redis-${i} ready."
                i=$((i + 1))
              done

              # Construire la liste des noeuds
              NODES=""
              i=0
              while [ $i -lt $REPLICA_COUNT ]; do
                NODES="$NODES redis-${i}.redis.${NAMESPACE}.svc.cluster.local:6379"
                i=$((i + 1))
              done

              # Valider le nombre de noeuds minimum
              MIN_NODES=$(( (CLUSTER_REPLICAS + 1) * 3 ))
              if [ $REPLICA_COUNT -lt $MIN_NODES ]; then
                echo "ERROR: $REPLICA_COUNT nodes insuffisant pour --cluster-replicas $CLUSTER_REPLICAS (minimum $MIN_NODES requis)"
                exit 1
              fi

              echo "Creating cluster: $NODES"
              redis-cli $AUTH --cluster create $NODES \
                --cluster-replicas $CLUSTER_REPLICAS --cluster-yes
{{- end }}
