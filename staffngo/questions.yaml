  # SECRETS COMMUNS ---------------------------------------------------------
  - variable: secret.secretValues.API_BASE_URL
    label: "API Base URL"
    type: string
    default: "https://api.staffngo.com"
    required: true
    group: "Secrets"

  - variable: secret.secretValues.AZURE_SERVICEBUS_CONNECTION_STRING
    label: "Azure ServiceBus"
    description: "azurePortal > namespace > servicebus > settings >
      SharedAccessPolicy > ConnectionString"
    type: string
    required: true
    group: "Secrets"

  - variable: secret.secretValues.AZURE_STORAGE_CONNECTION_STRING
    description:
      "azurePortal > namespace > (blob)storage > security > accessKeys >
      ConnectionString"
    label: "Azure Storage"
    type: string
    required: true
    group: "Secrets"

  - variable: secret.secretValues.SYNCFUSION_LISENCE
    label: "Syncfusion Licence"
    type: string
    required: true
    group: "Secrets"

