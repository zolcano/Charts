categories:
  - Staffngo

questions:
  # DÉPLOIEMENT -------------------------------------------------------------

  - variable: namespace
    label: "Namespace"
    description: "Namespace pour le déploiement."
    type: string
    default: "staffngo"
    required: true
    group: "Déploiement"

  - variable: environment
    label: "Environnement"
    description: "Environnement applicatif (sensible à la case)."
    type: string
    default: "Demo"
    required: true
    group: "Déploiement"

  - variable: enableInstallers
    label: "enabled Installers"
    description: "Mettre à true uniquement lors du premier déploiement."
    type: string
    default: "false"
    required: true
    group: "Déploiement"

  - variable: redisNamespace
    label: "Redis Namespace"
    description: "Namespace dans lequel Redis est déployé."
    type: string
    default: "redis"
    required: true
    group: "Déploiement"

  - variable: services.digidoc.enabled
    label: "digidoc"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.external.enabled
    label: "external"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.identity.enabled
    label: "identity"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.laborregister.enabled
    label: "laborregister"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.monitoring.enabled
    label: "monitoring"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.notification.enabled
    label: "notification"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.postal.enabled
    label: "postal"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.scheduler.enabled
    label: "scheduler"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.signature.enabled
    label: "signature"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.staffngo.enabled
    label: "staffngo"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.subscription.enabled
    label: "subscription"
    type: boolean
    default: true
    group: "Déploiement"

  - variable: services.vault.enabled
    label: "vault"
    type: boolean
    default: true
    group: "Déploiement"

  # TRAEFIK -----------------------------------------------------------------

  - variable: traefik.gateway.name
    label: "Gateway Name"
    description: "Nom de l'objet Gateway Traefik."
    type: string
    default: "traefik-gateway"
    required: true
    group: "Traefik"

  - variable: traefik.gateway.namespace
    label: "Gateway Namespace"
    description: "Namespace où Traefik est déployé."
    type: string
    default: "traefik"
    required: true
    group: "Traefik"

  - variable: traefik.gateway.sectionName
    label: "Section Name"
    description: "Section du Gateway à utiliser (ex: websecure)."
    type: string
    default: "websecure"
    required: true
    group: "Traefik"

  - variable: .traefik.httproute.url
    label: "API Base URL"
    description: "ne pas inscrire le protocole ( ex: https:// )"
    type: string
    default: "api.staffngo.com"
    required: true
    group: "Secrets"

  # REGISTRY ----------------------------------------------------------------

  - variable: registry.server
    label: "Registry Docker"
    description: "URL de l'Azure Container Registry."
    type: string
    default: "staffngoacr.azurecr.io"
    required: true
    group: "Registry"

  - variable: acrSecret.username
    label: "ACR - Username"
    type: string
    default: "staffngoacr"
    required: true
    group: "Registry"

  - variable: acrSecret.password
    label: "ACR - Password"
    type: password
    required: true
    group: "Registry"

  # SERVICES ----------------------------------------------------------------

  # ---------------- DIGIDOC ----------------

  - variable: services.digidoc.image
    label: "Image"
    type: string
    default: "digidoc.api"
    group: "Digidoc"

  - variable: services.digidoc.tag
    label: "Tag"
    type: string
    default: "20260526.2056"
    group: "Digidoc"

  - variable: services.digidoc.pullPolicy
    label: "Pull Policy"
    type: enum
    default: "IfNotPresent"
    options:
      - value: "IfNotPresent"
        label: "IfNotPresent"
      - value: "Always"
        label: "Always"
      - value: "Never"
        label: "Never"
    group: "Digidoc"

  - variable: services.digidoc.resources.requests.enabled
    label: "Requests"
    description: "Activer la réservation de ressources (requis par HPA)."
    type: boolean
    default: true
    show_subquestion_if: true
    subquestions:
      - variable: services.digidoc.resources.requests.cpu
        label: "CPU"
        description: "Quantité de CPU (millicores)."
        type: string
        default: "100m"
      - variable: services.digidoc.resources.requests.memory
        label: "Memory"
        description: "Quantité de mémoire (Mebibytes)."
        type: string
        default: "512Mi"
    group: "Digidoc"

  - variable: services.digidoc.resources.limits.enabled
    label: "Limits"
    description: "Activer la limite de ressources."
    type: boolean
    default: false
    show_subquestion_if: true
    subquestions:
      - variable: services.digidoc.resources.limits.cpu
        label: "CPU"
        description: "Limite CPU (millicores)."
        type: string
        default: "500m"
      - variable: services.digidoc.resources.limits.memory
        label: "Memory"
        description: "Limite mémoire (Mebibytes)."
        type: string
        default: "1024Mi"
    group: "Digidoc"

  - variable: services.digidoc.livenessProbe.enabled
    label: "Liveness Probe"
    description: "Activer la liveness probe."
    type: boolean
    default: true
    show_subquestion_if: true
    subquestions:
      - variable: services.digidoc.livenessProbe.httpGet.path
        label: "Route"
        type: string
        default: "/api/v1/health"
      - variable: services.digidoc.livenessProbe.initialDelaySeconds
        label: "Initial Delay (s)"
        type: int
        default: 10
      - variable: services.digidoc.livenessProbe.periodSeconds
        label: "Period (s)"
        type: int
        default: 10
      - variable: services.digidoc.livenessProbe.timeoutSeconds
        label: "Timeout (s)"
        type: int
        default: 1
      - variable: services.digidoc.livenessProbe.successThreshold
        label: "Success Threshold"
        type: int
        default: 1
      - variable: services.digidoc.livenessProbe.failureThreshold
        label: "Failure Threshold"
        type: int
        default: 3
    group: "Digidoc"

  - variable: services.digidoc.readinessProbe.enabled
    label: "Readiness Probe"
    description: "Activer la readiness probe."
    type: boolean
    default: true
    show_subquestion_if: true
    subquestions:
      - variable: services.digidoc.readinessProbe.httpGet.path
        label: "Route"
        type: string
        default: "/api/v1/health"
      - variable: services.digidoc.readinessProbe.initialDelaySeconds
        label: "Initial Delay (s)"
        type: int
        default: 10
      - variable: services.digidoc.readinessProbe.periodSeconds
        label: "Period (s)"
        type: int
        default: 10
      - variable: services.digidoc.readinessProbe.timeoutSeconds
        label: "Timeout (s)"
        type: int
        default: 1
      - variable: services.digidoc.readinessProbe.successThreshold
        label: "Success Threshold"
        type: int
        default: 1
      - variable: services.digidoc.readinessProbe.failureThreshold
        label: "Failure Threshold"
        type: int
        default: 10
    group: "Digidoc"

  - variable: services.digidoc.autoscaling.enabled
    label: "Autoscaling (HPA)"
    description: "Activer le Horizontal Pod Autoscaler."
    type: boolean
    default: true
    show_subquestion_if: true
    subquestions:
      - variable: services.digidoc.autoscaling.minReplicas
        label: "Min Replicas"
        type: int
        default: 2
      - variable: services.digidoc.autoscaling.maxReplicas
        label: "Max Replicas"
        type: int
        default: 5
      - variable: services.digidoc.autoscaling.targetCPUUtilizationPercentage
        label: "Target CPU Utilization (%)"
        type: int
        default: 70
    group: "Digidoc"

