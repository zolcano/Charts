namespace: "staffngo"
redisNamespace: redis
environment: "Demo"
enableInstallers: "false"

#----------------------------------------------------
traefik:
  gateway:
    name: "traefik-gateway"
    namespace: "traefik"
    sectionName: "websecure"
  httproute:
    url: "api.staffngo.com"

registry:
  server: "staffngoacr.azurecr.io"
  secretName: "acr-pull-secret"

acrSecret:
  name: "acr-pull-secret"
  username: "staffngoacr"
  password: ""

#----------------------------------------------------
secret:
  name: "common"
  secretValues:
    ASPNETCORE_HTTP_PORTS: "80"
    AZURE_SERVICEBUS_CONNECTION_STRING: ""
    AZURE_STORAGE_CONNECTION_STRING: ""
    SYNCFUSION_LISENCE: ""

configMap:
  name: "database-connections"
  values:
    digidoc: ""
    external: ""
    identity: ""
    laborregister: ""
    monitoring: ""
    notification: ""
    postal: ""
    scheduler: ""
    signature: ""
    staffngo: ""
    subscription: ""
    vault: ""

#----------------------------------------------------

services:
  digidoc:
    image: "digidoc.api"
    tag: "20260526.2056"
    pullPolicy: IfNotPresent
    replicaCount: 1
    healthCheckPath: "/api/v1/health"
    service:
      type: ClusterIP
      port: 80
      portName: "http"
    resources:
      requests:
        enabled: true
        cpu: "100m"
        memory: "512Mi"
      limits:
        enabled: false
        cpu: "500m"
        memory: "1024Mi"
    env:
      API_BASE_PATH: "digidoc"
    configKeys:
      - envVar: DB_CONNECTION_STRING
        configMapKey: digidoc
    livenessProbe:
      enabled: true
      httpGet:
        path: /api/v1/health
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
    readinessProbe:
      enabled: true
      httpGet:
        path: /api/v1/health
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 10
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    enabled: true

