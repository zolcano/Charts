{{- with .Values.services.mailind }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailind
  namespace: {{ $.Values.namespace }}
  labels:
    app: mailind
    app.kubernetes.io/managed-by: Helm
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app: mailind
  template:
    metadata:
      labels:
        app: mailind
    spec:
      imagePullSecrets:
        - name: {{ $.Values.registry.secretName }}
      containers:
        - name: mailind
          image: "{{ $.Values.registry.server }}/{{ .image }}:{{ .tag }}"
          imagePullPolicy: {{ .pullPolicy }}
          ports:
            {{- range .ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $key, $val := .env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
{{- end }}
