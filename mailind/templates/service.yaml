{{- with .Values.services.mailind }}
---
apiVersion: v1
kind: Service
metadata:
  name: mailind
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  type: {{ .service.type }}
  selector:
    app: mailind
  ports:
    {{- range .ports }}
    - name: {{ .name }}
      port: 80
      targetPort: {{ .port | int }}
      protocol: TCP
    {{- end }}
{{- end }}
