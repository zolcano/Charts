---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.traefik.backend.service }}-httproute
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.traefik.backend.service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  parentRefs:
    - name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
      sectionName: {{ .Values.traefik.gateway.sectionName }}
  hostnames:
    - {{ .Values.traefik.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mailind
          namespace: {{ .Values.namespace }}
          port: {{ index .Values.services.mailind.ports 0 "port" | int }}
