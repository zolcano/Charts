categories:
  - KPI Dashboard

questions:
  # ─────────────────────────────────────────────
  # NAMESPACE
  # ─────────────────────────────────────────────
  - variable: namespace
    label: "Namespace Kubernetes"
    description: "Namespace dans lequel déployer le chart."
    type: string
    default: "kpi"
    required: true
    group: "Général"

  # ─────────────────────────────────────────────
  # ACR / REGISTRY
  # ─────────────────────────────────────────────
  - variable: registry.server
    label: "Serveur de registre (ACR)"
    type: string
    default: "staffngoacr.azurecr.io"
    required: true
    group: "Registre (ACR)"

  - variable: acrSecret.username
    label: "Nom d'utilisateur ACR"
    type: string
    default: "staffngoacr"
    required: true
    group: "Registre (ACR)"

  - variable: acrSecret.password
    label: "Mot de passe ACR"
    type: password
    required: true
    group: "Registre (ACR)"

  # ─────────────────────────────────────────────
  # SERVICE / IMAGE
  # ─────────────────────────────────────────────
  - variable: services.aska.tag
    label: "Tag de l'image aska"
    type: string
    default: "270426"
    required: true
    group: "Application"

  - variable: services.aska.replicaCount
    label: "Nombre de replicas"
    type: int
    default: 1
    min: 1
    max: 10
    required: true
    group: "Application"

  - variable: services.aska.pullPolicy
    label: "Image Pull Policy"
    type: enum
    options:
      - "IfNotPresent"
      - "Always"
      - "Never"
    default: "IfNotPresent"
    required: true
    group: "Application"

  # ─────────────────────────────────────────────
  # TRAEFIK / INGRESS
  # ─────────────────────────────────────────────
  - variable: traefik.hostname
    label: "Nom de domaine (hostname)"
    type: hostname
    default: "aska.staffngo.com"
    required: true
    group: "Exposition / Traefik"

  - variable: traefik.gateway.name
    label: "Nom de la Gateway Traefik"
    type: string
    default: "traefik-gateway"
    required: true
    group: "Exposition / Traefik"

  - variable: traefik.gateway.namespace
    label: "Namespace de la Gateway Traefik"
    type: string
    default: "traefik"
    required: true
    group: "Exposition / Traefik"

  - variable: traefik.gateway.sectionName
    label: "Section de la Gateway (entrypoint)"
    description: "Nom de la section listener dans la Gateway (ex: websecure, web)."
    type: string
    default: "websecure"
    required: true
    group: "Exposition / Traefik"

  # ─────────────────────────────────────────────
  # SECRET
  # ─────────────────────────────────────────────

  - variable: secret.aska-sec.CLAUDE_KEY
    label: "claude key"
    type: password
    required: true
    group: "Secret"

  - variable: secret.aska-sec.DASHBOARD_PASSWORD
    label: "Mot de passe du tableau de bord"
    type: password
    required: true
    group: "Secret"

  - variable: secret.aska-sec.CUSTOMGPT_API_KEY
    label: "API Key CustomGPT"
    type: password
    required: true
    group: "Secret"

  - variable: secret.aska-sec.RESOLUTION_PROJECT_ID
    label: "ID du projet de résolution"
    type: string
    default: "95474"
    required: true
    group: "Secret"

  - variable: secret.aska-sec.CLASSIFIER_PROJECT_ID
    label: "ID du projet de classification"
    type: string
    default: "95515"
    required: true
    group: "Secret"

  - variable: secret.aska-sec.UTILITY_PROJECT_ID
    label: "ID du projet d'utilité"
    type: string
    default: "95517"
    required: true
    group: "Secret"

  - variable: secret.aska-sec.HUBSPOT_API_KEY
    label: "HubSpot API Key"
    type: password
    required: true
    group: "Secret"

  - variable: secret.aska-sec.HUBSPOT_PIPELINE_ID
    label: "HubSpot Pipeline ID"
    type: string
    default: "0"
    required: true
    group: "Secret"

  - variable: secret.aska-sec.ASKA_AGENT_ID
    label: "ASKA Agent ID"
    type: string
    default: "A-30171857"
    required: true
    group: "Secret"

  - variable: secret.aska-sec.ASKA_INTEGRATION_ID
    label: "ASKA Integration ID"
    type: string
    default: "I-15365111"
    required: true
    group: "Secret"

  - variable: secret.aska-sec.TEAMS_WEBHOOK_URL
    label: "Teams Webhook URL"
    type: string
    default: "https://staffngocom.webhook.office.com/webhookb2/fd2ae9f2-ad5a-408d-99ba-5802a89f67fc@8d66d582-1bcf-4f67-b52f-5bbbe7b7c306/IncomingWebhook/9a38c294454d4023a391ca7f49a1f500/603fb5eb-02a1-4d48-a808-1a21f8b00c8f/V2LsfeJV3Iv7zsIPM6_r8JBJGPNLQ7-nOtvo6Lb6nH6IA1"
    required: false
    group: "Secret"
