---
apiVersion: v1
kind: Service
metadata:
  name: aska
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: {{ .Values.services.aska.service.type }}
  selector:
    app: aska
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
