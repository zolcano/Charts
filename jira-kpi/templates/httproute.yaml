---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kpi.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
      sectionName: {{ .Values.traefik.gateway.sectionName }}
  hostnames:
    - {{ .Values.traefik.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.traefik.backend.service }}
          namespace: {{ .Values.namespace }}
          port: {{ (index .Values.services "jira-kpi").service.port }}
