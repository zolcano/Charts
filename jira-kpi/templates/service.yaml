{{- range $svcName, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "kpi.labels" $ | nindent 4 }}
    {{- include "kpi.selectorLabels" $svcName | nindent 4 }}
spec:
  type: {{ $svc.service.type }}
  selector:
    {{- include "kpi.selectorLabels" $svcName | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ $svc.service.port }}
      targetPort: http
{{- end }}
