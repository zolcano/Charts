{{- range $svcName, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: kpi
spec:
  type: {{ $svc.service.type }}
  selector:
    app: kpi
  ports:
    - name: http
      protocol: TCP
      port: {{ $svc.service.port }}
      targetPort: http
{{- end }}
